[package]
name = "topohedral-geometry"
version = "0.0.0"
edition = "2021"

[features]
trace = ["topohedral-tracing/trace"]

[dependencies]
approx = "0.5.1"
topohedral-tracing = {version = "0.2.0", registry = "cloudsmith"}
topohedral-linalg = {version = "5.0.0", registry = "cloudsmith"}
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.17"
vtkio = "0.6.3"
ctor = "0.6.3"